# Copy to ~/.config/omarchy-translate/config.toml
# or run: omarchy-translate init
# then:   omarchy-translate prefs

# auto = system language from LANG / LC_MESSAGES (en_US -> en)
target = "auto"

# auto = detect the source language
source = "auto"

# google | mymemory | libretranslate
engine = "google"

# clipboard | primary | auto
# The keybind copies the selection first, then this TUI reads the clipboard.
grab = "clipboard"

# Copy the translation as soon as it arrives
copy_result = false

# Used only when engine = "libretranslate".
# LibreTranslate never falls back to Google or MyMemory.
# Prefer OMARCHY_TRANSLATE_LT_KEY over putting a key on the command line.
libretranslate_url = "http://127.0.0.1:5000"
libretranslate_api_key = ""
